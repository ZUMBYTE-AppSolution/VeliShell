name: VeliShell Windows CI

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: velishell-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Test, portable package and installer
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Verify public repository boundary
        run: ./tools/Assert-PublicRepository.ps1

      - name: Read product version
        id: version
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw "Invalid release version: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test and publish self-contained Windows application
        run: ./tools/Build.ps1 -Portable

      - name: Build per-machine MSI with optional service feature
        run: ./tools/Build-Installer.ps1 -Version '${{ steps.version.outputs.value }}' -PublishDirectory ./out/portable

      - name: Install, start and remove optional Windows service
        run: ./tools/Test-InstalledUpdateService.ps1 -InstallerPath './out/installer/VeliShell-${{ steps.version.outputs.value }}-win-x64.msi'

      - name: Create versioned release candidates
        run: ./tools/New-ReleaseArtifacts.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Upload unsigned CI packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VeliShell-${{ steps.version.outputs.value }}-Windows-x64-unsigned-ci
          path: out/release/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VeliShell-Windows-build-logs
          path: |
            out/*.log
            out/*.uninstall.log
          if-no-files-found: ignore
          retention-days: 7
