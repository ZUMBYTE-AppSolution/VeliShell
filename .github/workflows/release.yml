name: Publish VeliShell release

"on":
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: velishell-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows-x64:
    name: Build and publish Windows x64
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate tag, version, changelog and repository boundary
        id: version
        run: |
          ./tools/Assert-PublicRepository.ps1
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Directory.Build.props version $version."
          }
          ./tools/Get-ReleaseNotes.ps1 -Version $version -OutputPath ./out/release-notes.md
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test and publish self-contained application
        run: ./tools/Build.ps1 -Portable

      - name: Sign application when certificate secrets are configured
        id: sign_app
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PFX)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)
          if ($hasPfx -xor $hasPassword) { throw 'Both Windows signing secrets must be configured together.' }
          if ($hasPfx) {
            $executables = @('./out/portable/VeliShell.exe')
            ./tools/Sign-WindowsArtifacts.ps1 -Files $executables -CertificateBase64 $env:SIGNING_PFX -CertificatePassword $env:SIGNING_PASSWORD
            'signed=true' >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning 'Publishing an unsigned application; Windows SmartScreen may warn users.'
            'signed=false' >> $env:GITHUB_OUTPUT
          }

      - name: Build per-machine MSI
        run: ./tools/Build-Installer.ps1 -Version '${{ steps.version.outputs.value }}' -PublishDirectory ./out/portable

      - name: Sign installer when certificate secrets are configured
        if: steps.sign_app.outputs.signed == 'true'
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./tools/Sign-WindowsArtifacts.ps1 -Files './out/installer/VeliShell-${{ steps.version.outputs.value }}-win-x64.msi' -CertificateBase64 $env:SIGNING_PFX -CertificatePassword $env:SIGNING_PASSWORD

      - name: Smoke-test MSI install, uninstall and v0.3.1 upgrade
        run: ./tools/Test-InstallerLifecycle.ps1 -Version '${{ steps.version.outputs.value }}' -InstallerPath './out/installer/VeliShell-${{ steps.version.outputs.value }}-win-x64.msi' -AllowMachineChanges

      - name: Create release artifacts and security notice
        run: |
          ./tools/New-ReleaseArtifacts.ps1 -Version '${{ steps.version.outputs.value }}'
          if ('${{ steps.sign_app.outputs.signed }}' -ne 'true') {
            Add-Content ./out/release-notes.md "`n> [!WARNING]`n> Dieses Release besitzt noch keine Windows-Herausgebersignatur. Prüfe `SHA256SUMS.txt`; Windows SmartScreen kann vor der Installation warnen.`n" -Encoding utf8
          }

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            out/release/VeliShell-${{ steps.version.outputs.value }}-win-x64.msi
            out/release/VeliShell-${{ steps.version.outputs.value }}-win-x64-portable.zip
            out/release/VeliShell-Setup-win-x64.msi
            out/release/VeliShell-Portable-win-x64.zip
            out/release/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $assets = @(
            "out/release/VeliShell-$version-win-x64.msi",
            "out/release/VeliShell-$version-win-x64-portable.zip",
            'out/release/VeliShell-Setup-win-x64.msi',
            'out/release/VeliShell-Portable-win-x64.zip',
            'out/release/SHA256SUMS.txt',
            'out/release/RELEASE-INFO.txt'
          )
          gh release create "v$version" @assets --verify-tag --latest --title "VeliShell $version" --notes-file out/release-notes.md
