name: Submit VeliShell MSIX to Microsoft Store

"on":
  workflow_call:
    inputs:
      tag:
        description: Stable GitHub release tag to submit
        required: true
        type: string
      access_check_only:
        description: Verify that Partner Center exposes the Store app without submitting a package
        required: false
        default: false
        type: boolean
    secrets:
      AZURE_AD_APPLICATION_CLIENT_ID:
        required: true
      AZURE_AD_APPLICATION_SECRET:
        required: true
      AZURE_AD_TENANT_ID:
        required: true
      SELLER_ID:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag, for example v0.6.1
        required: true
        type: string
      access_check_only:
        description: Check Partner Center access only; do not build or submit a package
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: velishell-store-production
  cancel-in-progress: false

jobs:
  submit-msix:
    name: Build and submit Store MSIX
    runs-on: windows-2025
    timeout-minutes: 50
    environment: microsoft-store-production
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID }}
      STORE_IDENTITY_NAME: ${{ vars.MICROSOFT_STORE_PACKAGE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.MICROSOFT_STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME }}
      STORE_FIRST_PUBLICATION_DONE: ${{ vars.MICROSOFT_STORE_FIRST_PUBLICATION_DONE }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Store listing assets
        if: ${{ !inputs.access_check_only }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: store-listing
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.402'

      - name: Validate tag and Store identity
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$') {
            throw "Only stable SemVer tags can be submitted, got '$env:RELEASE_TAG'."
          }
          $version = $Matches.version
          if ($env:STORE_FIRST_PUBLICATION_DONE -ne 'true') {
            throw 'The first Store publication must be completed in Partner Center before CLI updates are enabled.'
          }
          [xml]$props = Get-Content -LiteralPath Directory.Build.props -Raw
          if ([string]$props.Project.PropertyGroup.Version -ne $version) {
            throw "Tag $env:RELEASE_TAG does not match Directory.Build.props."
          }
          ./tools/Assert-PublicRepository.ps1

          $requiredVariables = @{
            MICROSOFT_STORE_PRODUCT_ID = $env:STORE_PRODUCT_ID
            MICROSOFT_STORE_PACKAGE_IDENTITY_NAME = $env:STORE_IDENTITY_NAME
            MICROSOFT_STORE_PUBLISHER = $env:STORE_PUBLISHER
          }
          foreach ($entry in $requiredVariables.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace([string]$entry.Value)) {
              throw "Required repository or environment variable $($entry.Key) is not configured."
            }
          }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "GitHub release $env:RELEASE_TAG was not found." }
          if ($release.draft -or $release.prerelease) {
            throw 'Draft and prerelease builds cannot be submitted to the production Store listing.'
          }

          $msixPath = Join-Path $env:GITHUB_WORKSPACE "out/store/VeliShell-$version-win-x64.msix"
          "msix_path=$msixPath" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate localized release notes
        if: ${{ !inputs.access_check_only }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          foreach ($locale in @('de-de', 'en-us')) {
            $path = "./store-listing/assets/store/release-notes/$env:RELEASE_TAG.$locale.txt"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing $locale Store release notes for $env:RELEASE_TAG."
            }
            $notes = (Get-Content -LiteralPath $path -Raw -Encoding utf8).Trim()
            if ([string]::IsNullOrWhiteSpace($notes) -or $notes.Length -gt 1500) {
              throw "$locale Store release notes must contain 1 to 1500 characters."
            }
            Write-Host "$locale Store release notes validated ($($notes.Length) characters)."
          }

      - name: Test and publish self-contained application
        if: ${{ !inputs.access_check_only }}
        run: ./tools/Build.ps1 -Portable

      - name: Build unsigned Store MSIX
        if: ${{ !inputs.access_check_only }}
        env:
          MSIX_PATH: ${{ steps.package.outputs.msix_path }}
        run: |
          $publisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
          if ([string]::IsNullOrWhiteSpace($publisherDisplayName)) {
            $publisherDisplayName = 'Zumbyte - AppSolution'
          }
          ./tools/Build-StoreMsix.ps1 `
            -Version '${{ steps.package.outputs.version }}' `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $publisherDisplayName `
            -PublishDirectory ./out/portable `
            -OutputPath $env:MSIX_PATH

      - name: Upload Store submission package
        if: ${{ !inputs.access_check_only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VeliShell-${{ steps.package.outputs.version }}-Microsoft-Store-MSIX
          path: ${{ steps.package.outputs.msix_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Install Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Authenticate with Partner Center
        env:
          STORE_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $required = @{
            AZURE_AD_TENANT_ID = $env:STORE_TENANT_ID
            SELLER_ID = $env:STORE_SELLER_ID
            AZURE_AD_APPLICATION_CLIENT_ID = $env:STORE_CLIENT_ID
            AZURE_AD_APPLICATION_SECRET = $env:STORE_CLIENT_SECRET
          }
          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace([string]$entry.Value)) {
              throw "Required secret $($entry.Key) is not configured."
            }
          }
          msstore reconfigure `
            --tenantId $env:STORE_TENANT_ID `
            --sellerId $env:STORE_SELLER_ID `
            --clientId $env:STORE_CLIENT_ID `
            --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store CLI authentication failed.' }

      - name: Verify Partner Center application access
        run: |
          $applications = & msstore apps list 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Partner Center did not return an app list for the configured Entra application.' }
          $visible = $applications.Contains($env:STORE_PRODUCT_ID, [StringComparison]::OrdinalIgnoreCase)
          Write-Host "Configured Store product ID appears in app list: $visible"
          if (-not $visible) {
            throw 'The configured Entra application cannot see this Store product. Check the Seller ID, Partner Center association and Manager role before publishing.'
          }
          msstore apps get $env:STORE_PRODUCT_ID | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'The configured Entra application cannot retrieve the Store product.' }

      - name: Inspect pending Store draft structure
        if: ${{ inputs.access_check_only }}
        run: |
          $draft = (msstore submission get $env:STORE_PRODUCT_ID | Out-String) | ConvertFrom-Json -AsHashtable
          if ($LASTEXITCODE -ne 0) { throw 'The pending Store draft could not be inspected.' }
          Write-Host "Draft top-level fields: $(@($draft.Keys) -join ', ')"
          Write-Host "Draft status: $($draft['Status']); price: $($draft['Pricing']['PriceId'])"
          Write-Host "Draft locales: $(@($draft['Listings'].Keys) -join ', ')"
          $firstLocale = @($draft['Listings'].Keys)[0]
          Write-Host "First listing fields: $(@($draft['Listings'][$firstLocale].Keys) -join ', ')"
          Write-Host "First base listing fields: $(@($draft['Listings'][$firstLocale]['BaseListing'].Keys) -join ', ')"
          Write-Host "Draft packages: $(@($draft['ApplicationPackages'] | ForEach-Object { $_['FileName'] + ':' + $_['FileStatus'] }) -join ', ')"
          foreach ($field in @('data', 'responseData', 'submission', 'package')) {
            if ($draft.Contains($field) -and $draft[$field] -is [System.Collections.IDictionary]) {
              Write-Host "Draft $field fields: $(@($draft[$field].Keys) -join ', ')"
            }
          }

      - name: Upload MSIX into Store draft
        if: ${{ !inputs.access_check_only }}
        env:
          MSIX_PATH: ${{ steps.package.outputs.msix_path }}
        run: |
          $current = (msstore submission get $env:STORE_PRODUCT_ID | Out-String) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $current.Status -ne 'Published') {
            throw "The Store submission is not in the expected Published state ($($current.Status)). No existing draft or certification will be replaced automatically."
          }
          msstore publish $env:MSIX_PATH -id $env:STORE_PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw 'Partner Center rejected the draft MSIX upload.' }

      - name: Update Windows screenshot and localized Store release notes
        if: ${{ !inputs.access_check_only }}
        env:
          MSIX_PATH: ${{ steps.package.outputs.msix_path }}
          STORE_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          ./store-listing/tools/Update-StoreScreenshot.ps1 `
            -ProductId $env:STORE_PRODUCT_ID `
            -MsixPath $env:MSIX_PATH `
            -ScreenshotPath ./store-listing/assets/store/velishell-windows-desktop.png `
            -GermanReleaseNotesPath ./store-listing/assets/store/release-notes/${{ inputs.tag }}.de-de.txt `
            -EnglishReleaseNotesPath ./store-listing/assets/store/release-notes/${{ inputs.tag }}.en-us.txt `
            -TenantId $env:STORE_TENANT_ID `
            -ClientId $env:STORE_CLIENT_ID `
            -ClientSecret $env:STORE_CLIENT_SECRET

      - name: Submit updated package and listing for certification
        if: ${{ !inputs.access_check_only }}
        run: |
          msstore submission publish $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw 'Partner Center rejected the Store submission.' }
          msstore submission status $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw 'The submitted Store status could not be read.' }

      - name: Write submission summary
        if: ${{ !inputs.access_check_only }}
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          @(
            '## Microsoft Store MSIX submitted',
            '',
            "VeliShell $env:RELEASE_VERSION, the Windows desktop screenshot, and German/English release notes were submitted to Partner Center for certification.",
            '',
            'Microsoft signs the Store-delivered package after certification.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
